name: Práctica 04

on:
  push:
    branches: [ main, master ]
    paths:
      - 'practicas/practica_04/**'
      - '.github/workflows/practica_04.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'practicas/practica_04/**'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-timeout

      - name: Ejecutar tests
        run: |
          python -m pytest practicas/practica_04/tests -q --cov=practicas/practica_04 --cov-report=term-missing --cov-report=html
        timeout-minutes: 5

      - name: Subir reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-practica-04
          path: practicas/practica_04/htmlcov/
          retention-days: 30
