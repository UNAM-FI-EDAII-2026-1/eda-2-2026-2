name: Práctica 01 - Insertion Sort

on:
  push:
    branches: [ main, master ]
    paths:
      - 'practicas/practica_01/**'
      - '.github/workflows/practica_01.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'practicas/practica_01/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
    
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-timeout
    
    - name: Ejecutar tests
      run: |
        cd practicas/practica_01
        pytest tests/ -v \
          --cov=. \
          --cov-report=term-missing \
          --cov-report=html \
          --tb=short
      timeout-minutes: 5
    
    - name: Subir reporte de cobertura
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-practica-01
        path: practicas/practica_01/htmlcov/
        retention-days: 30
    
    - name: Comentar resultados en PR
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const coverage = fs.readFileSync('practicas/practica_01/htmlcov/index.html', 'utf8');
          const coverageMatch = coverage.match(/(\d+)%/);
          const coveragePercent = coverageMatch ? coverageMatch[1] : 'N/A';
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `## 📊 Práctica 01 - Resultados\n\n**Cobertura:** ${coveragePercent}%\n\n✅ Tests completados. Revisa los detalles en la pestaña Actions.`
          });
